name: AI Review

on:
  push:
    branches:
      - main
      - feature/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install openai

      - name: Run AI review
        run: |
          python scripts/ai_review.py
